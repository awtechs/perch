name: Package public Perch plugin
on:
  push:
    branches: [main]
    paths: ['plugins/perch/**', 'scripts/package-public-plugin.py', '.github/workflows/plugin-package.yml']
  pull_request:
    paths: ['plugins/perch/**', 'scripts/package-public-plugin.py', '.github/workflows/plugin-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-public-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: perch-public-plugin
          path: artifacts/perch-plugin.zip
          if-no-files-found: error
