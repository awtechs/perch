name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: perch-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck && npm run build && npm test && npm run test:deploy
      - name: Package release
        run: |
          npm prune --omit=dev --no-audit --no-fund
          git rev-parse HEAD > COMMIT
          tar --exclude='node_modules/.bin' -czf perch.tar.gz dist node_modules package.json package-lock.json COMMIT
          sha256sum perch.tar.gz > perch.tar.gz.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" perch.tar.gz perch.tar.gz.sha256 --verify-tag --generate-notes
